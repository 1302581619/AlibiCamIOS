name: AlibiCam

options:
  deploymentTarget:
    iOS: "15.0"
  bundleIdPrefix: app.leo

settings:
  PRODUCT_NAME: AlibiCam
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
  CODE_SIGNING_ALLOWED: NO
  CODE_SIGNING_REQUIRED: NO
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1,2"
  GENERATE_INFOPLIST_FILE: NO
  ALWAYS_SEARCH_USER_PATHS: NO
  CLANG_ENABLE_MODULES: YES

targets:
  AlibiCam:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    configFiles: {}
    sources:
      - path: AlibiCam
        excludes:
          - "Info.plist"
          - "**/*.entitlements"
    info:
      path: AlibiCam/Info.plist
    settings:
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.leo.alibi-cam-ios
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.leo.alibi-cam-ios
